<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff – CaffCrew</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f10">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="js/splash.js"></script>
</head><body>
<div class="top"><a class="logo" href="dashboard.html">Caff<span>Crew</span></a><button class="btn ghost" id="out">Log out</button></div>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h2>Staff</h2>
  <div class="panel">
    <b>Invite staff</b>
    <form id="f">
      <div class="row">
        <div><label>Email</label><input id="email" type="email" required placeholder="chef@example.com"></div>
        <div><label>Role</label>
          <select id="role"><option value="kitchen">Kitchen (sees orders)</option><option value="waiter">Waiter (orders + tables)</option><option value="manager">Manager (menu, analytics)</option></select></div>
      </div>
      <button class="btn" id="btn">Send invite</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="hint" style="margin-top:10px">Ask them to open <b>join.html</b> on your site, create an account with this same email, and they will get access automatically.</p>
  </div>
  <div class="panel"><b>Team</b><div id="team" style="margin-top:6px"></div></div>
  <div class="panel"><b>Pending invites</b><div id="inv" style="margin-top:6px"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>
let R, me;
const say = (t, c) => { $('msg').textContent = t; $('msg').className = 'msg ' + (c || ''); };
async function load(){
  const [s, i] = await Promise.all([
    dfClient.rpc('list_staff', { p_restaurant: R.id }),
    dfClient.from('staff_invites').select('*').eq('restaurant_id', R.id).order('created_at')
  ]);
  if (s.error) { $('team').innerHTML = `<p class="msg err">${esc(s.error.message)}</p>`; return; }
  $('team').innerHTML = (s.data || []).map(m => `<div class="item"><div class="info"><b>${esc(m.email)}</b><small>${esc(m.role)}</small></div>
    <div class="acts">${m.role === 'owner' ? '<span class="tag">Owner</span>' : `<button class="btn sm danger" data-rm="${m.user_id}">Remove</button>`}</div></div>`).join('');
  $('inv').innerHTML = (i.data || []).map(x => `<div class="item"><div class="info">${esc(x.email)}<small>${esc(x.role)} · waiting to sign up</small></div>
    <div class="acts"><button class="btn sm danger" data-cancel="${esc(x.email)}">Cancel</button></div></div>`).join('') || '<p style="color:var(--muted);font-size:14px">None.</p>';
}
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('btn').disabled = true;
  const { error } = await dfClient.from('staff_invites').upsert({ restaurant_id: R.id, email: $('email').value.trim().toLowerCase(), role: $('role').value });
  $('btn').disabled = false;
  if (error) return say(error.message, 'err');
  say('Invite saved ✓', 'ok'); $('email').value = ''; load();
});
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rm && confirm('Remove this person?')) { await dfClient.from('restaurant_members').delete().eq('restaurant_id', R.id).eq('user_id', b.dataset.rm); load(); }
  if (b.dataset.cancel) { await dfClient.from('staff_invites').delete().eq('restaurant_id', R.id).eq('email', b.dataset.cancel); load(); }
});
adminInit('admin-staff.html').then(x => { if (x) { R = x.r; load(); } });
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
