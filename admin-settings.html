<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings – CaffCrew</title>
<link rel="stylesheet" href="css/auth.css">





<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121110">
<meta name="application-name" content="CaffCrew">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CaffCrew">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/brand.css">
<script src="js/coin.js"></script>
<script src="js/splash.js"></script>
<script src="js/pwa.js" defer></script>
</head><body class="df-app">
<div class="top"><a class="logo" href="dashboard.html"><img class="lg" src="icons/logo-96.png" alt="" width="36" height="36"><em class="lt">Caff<span>Crew</span></em></a><button class="btn ghost" id="out">Log out</button></div>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h2>Settings</h2>
  <div class="panel">
    <form id="f">
      <label>Restaurant name</label><input id="name" required maxlength="60">
      <label>Phone (optional)</label><input id="phone" type="tel" maxlength="20">
      <label>Brand color</label><input id="color" type="color" style="height:46px;padding:4px">
      <label>UPI ID (for customer payments)</label>
      <input id="upi" placeholder="yourname@okhdfcbank" autocapitalize="none">
      <div class="hint">Customers will pay directly to this UPI ID. Leave empty to accept cash only.</div>
      <label>Logo URL (optional)</label><input id="logo" type="url" placeholder="https://.../logo.png">
      <label>Menu theme</label><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select>
      <div class="hint" id="bhint" style="display:none">Logo and theme need one-time database setup (supabase-update.sql).</div>
      <button class="btn" id="btn">Save settings</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="panel"><b>Live preview</b><p class="hint" style="margin:4px 0 12px">What guests see after scanning the QR code.</p>
    <div id="pv"><div class="pvh"><img id="pvlogo" alt=""><b id="pvname"></b></div>
      <div class="pvd"><span><i class="pvdot"></i>Paneer Tikka</span><b>₹260</b></div><div class="pvd"><span><i class="pvdot"></i>Masala Chai</span><b>₹40</b></div>
      <button type="button" id="pvbtn">View cart · ₹300</button></div></div>
</div>
<style>#pv{max-width:340px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--bg);color:var(--text);transition:background .3s,color .3s}.pvh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font:700 20px var(--df-display)}#pvlogo{width:36px;height:36px;border-radius:50%;object-fit:cover;display:none}.pvd{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.pvdot{display:inline-block;width:9px;height:9px;border-radius:2px;background:#3fbf6b;margin-right:8px}#pvbtn{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;font:700 15px var(--df-body);color:#1a1006}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>
let R, extra = false;
const say = (t, c) => { $('msg').textContent = t; $('msg').className = 'msg ' + (c || ''); };
async function load(){
  const { data, error } = await dfClient.from('restaurants').select('*').eq('id', R.id).single();
  if (error) return say(error.message, 'err');
  $('name').value = data.name; $('phone').value = data.phone || ''; $('color').value = data.brand_color || '#ff7a1a'; $('upi').value = data.upi_id || '';
  extra = 'logo_url' in data && 'menu_theme' in data;
  if (extra) { $('logo').value = data.logo_url || ''; $('theme').value = data.menu_theme || 'dark'; } else { $('logo').disabled = $('theme').disabled = true; $('bhint').style.display = 'block'; }
  paint();
}
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('btn').disabled = true; say('Saving…');
  const { error } = await dfClient.from('restaurants').update({
    name: $('name').value.trim(), phone: $('phone').value.trim() || null,
    brand_color: $('color').value, upi_id: $('upi').value.trim() || null,
    ...(extra ? { logo_url: $('logo').value.trim() || null, menu_theme: $('theme').value } : {})
  }).eq('id', R.id);
  $('btn').disabled = false;
  say(error ? (error.message.includes('upi_id') ? 'UPI ID looks invalid. Example: name@okhdfcbank' : error.message) : 'Saved ✓', error ? 'err' : 'ok');
});
function paint(){
  const light = $('theme').value === 'light', pv = $('pv'), lg = $('logo').value.trim();
  [['--bg', light ? '#faf6ef' : '#121110'], ['--text', light ? '#1d1812' : '#f4efe8'], ['--line', light ? '#e6dccb' : '#2f2b26']].forEach(([k, v]) => pv.style.setProperty(k, v));
  $('pvname').textContent = $('name').value || 'Your restaurant'; $('pvbtn').style.background = $('color').value;
  $('pvlogo').style.display = lg ? 'block' : 'none'; if (lg) $('pvlogo').src = lg;
}
['name', 'logo', 'theme', 'color'].forEach(i => $(i).addEventListener('input', paint));
adminInit('admin-settings.html').then(x => { if (x) { R = x.r; load(); } });
</script>

</body></html>
