<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<style>
:root{--bg:#0f0f10;--card:#181819;--line:#2a2a2c;--text:#f5f5f4;--muted:#a1a1a6;--accent:#ff7a1a;--err:#ff5c5c;--ok:#3ddc84}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:90px}
header{padding:18px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,16,.95);backdrop-filter:blur(8px);z-index:5}
header h1{font-size:20px}
header .tb{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.wrap{padding:6px 16px}
.cat{font-size:15px;color:var(--accent);margin:18px 0 6px;font-weight:700;letter-spacing:.3px}
.dish{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.dish img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:var(--card);flex:none}
.dish .in{flex:1;min-width:0}
.dish h3{font-size:16px}
.dish p{color:var(--muted);font-size:13px;margin:2px 0}
.dish .al{font-size:12px;color:#ffb36b}
.dot{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;border:2px solid}
.dot.veg{border-color:var(--ok);background:var(--ok)}.dot.nv{border-color:var(--err);background:var(--err)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pr b{font-size:16px}
.add{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:6px 18px;border-radius:8px;font-weight:700;cursor:pointer}
.qty{display:flex;align-items:center;gap:12px;background:var(--accent);color:#111;border-radius:8px;padding:3px 8px;font-weight:800}
.qty button{background:none;border:0;font-size:20px;font-weight:800;cursor:pointer;color:#111;width:24px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);z-index:6}
.btn{width:100%;background:var(--accent);color:#111;font-weight:800;border:0;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;display:flex;justify-content:space-between}
.btn.plain{justify-content:center}
.btn:disabled{opacity:.6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet .in{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px 24px}
.sheet h2{margin-bottom:10px}
.ci{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
textarea{width:100%;background:#0f0f10;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px;font-size:15px;margin-top:12px;font-family:inherit}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0}
.msg{font-size:14px;margin-top:10px;text-align:center}.err{color:var(--err)}
.center{text-align:center;padding:60px 20px;color:var(--muted)}
.steps{display:flex;justify-content:space-between;margin:22px 0}
.st{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.st i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;background:var(--line);line-height:34px;font-style:normal}
.st.on{color:var(--text)}.st.on i{background:var(--accent);color:#111;font-weight:800}
.help{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.help button{flex:1;background:transparent;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px;cursor:pointer;font-size:14px}
.stars button{background:none;border:0;font-size:34px;color:var(--line);cursor:pointer}
.stars button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
</style></head><body>

<div id="app"><div class="center">Loading menu…</div></div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = new URLSearchParams(location.search);
const slug = P.get('r'), tableId = P.get('t');
let R, T, cats = [], items = [], cart = {}, vegOnly = false, activeCat = 'all', orderId = null, pollTimer;

async function init(){
  if (!slug) return fail('Invalid QR code.');
  const { data: r } = await dfClient.from('restaurants').select('id,name,brand_color,upi_id').eq('slug', slug).eq('is_active', true).maybeSingle();
  if (!r) return fail('Restaurant not found.');
  R = r; document.title = R.name + ' – Menu';
  if (R.brand_color && /^#[0-9a-fA-F]{6}$/.test(R.brand_color)) document.documentElement.style.setProperty('--accent', R.brand_color);
  if (tableId) { const { data: t } = await dfClient.from('dining_tables').select('id,label').eq('id', tableId).eq('restaurant_id', R.id).maybeSingle(); T = t; }
  const [c, i] = await Promise.all([
    dfClient.from('menu_categories').select('*').eq('restaurant_id', R.id).order('sort_order'),
    dfClient.from('menu_items').select('*').eq('restaurant_id', R.id).eq('is_available', true).order('name')
  ]);
  cats = c.data || []; items = i.data || [];
  const saved = localStorage.getItem('df_order_' + R.id);
  if (saved) { orderId = saved; return track(); }
  renderMenu();
}
function fail(m){ $('app').innerHTML = `<div class="center">${esc(m)}</div>`; }

function renderMenu(){
  const vis = items.filter(m => (!vegOnly || m.is_veg));
  const groups = [...cats.map(c => ({ id: c.id, name: c.name })), { id: null, name: 'Other' }]
    .map(g => ({ ...g, list: vis.filter(m => (m.category_id || null) === g.id) })).filter(g => g.list.length && (activeCat === 'all' || activeCat === g.id));
  const chips = `<button class="chip ${activeCat==='all'?'on':''}" data-cat="all">All</button>` +
    cats.map(c => `<button class="chip ${activeCat===c.id?'on':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('') +
    `<button class="chip ${vegOnly?'on':''}" data-veg="1">🟢 Veg only</button>`;
  const total = Object.entries(cart).reduce((s,[id,q]) => s + q * +items.find(m => m.id === id).price, 0);
  const count = Object.values(cart).reduce((a,b) => a + b, 0);
  $('app').innerHTML = `
    <header><h1>${esc(R.name)}</h1><div class="tb">${T ? 'Table ' + esc(T.label) : 'No table selected'}</div><div class="chips">${chips}</div></header>
    <div class="wrap">${groups.map(g => `<div class="cat">${esc(g.name.toUpperCase())}</div>` + g.list.map(dish).join('')).join('') || '<div class="center">No dishes available yet.</div>'}</div>
    ${count ? `<div class="bar"><button class="btn" data-cart="1"><span>${count} item${count>1?'s':''}</span><span>View cart · ₹${total.toFixed(2)}</span></button></div>` : ''}`;
}
function dish(m){
  const q = cart[m.id] || 0;
  return `<div class="dish">${m.image_url ? `<img src="${esc(m.image_url)}" alt="" loading="lazy">` : ''}
    <div class="in"><h3><span class="dot ${m.is_veg?'veg':'nv'}"></span>${esc(m.name)}</h3>
    ${m.description ? `<p>${esc(m.description)}</p>` : ''}
    ${(m.allergens||[]).length ? `<div class="al">⚠ Contains: ${m.allergens.map(esc).join(', ')}</div>` : ''}
    <div class="pr"><b>₹${esc(m.price)}</b>${q ? `<div class="qty"><button data-dec="${m.id}">−</button>${q}<button data-inc="${m.id}">+</button></div>` : `<button class="add" data-inc="${m.id}">ADD</button>`}</div></div></div>`;
}

function openCart(){
  const rows = Object.entries(cart).map(([id,q]) => { const m = items.find(x => x.id === id); return `<div class="ci"><span>${q} × ${esc(m.name)}</span><span>₹${(q*m.price).toFixed(2)}</span></div>`; }).join('');
  const total = Object.entries(cart).reduce((s,[id,q]) => s + q * +items.find(m => m.id === id).price, 0);
  $('sheetIn').innerHTML = `<h2>Your order</h2>${rows}
    <textarea id="note" rows="2" maxlength="300" placeholder="Special instructions (optional)"></textarea>
    <div class="tot"><span>Total</span><span>₹${total.toFixed(2)}</span></div>
    <div style="font-size:13px;color:var(--muted)">Pay at the counter or to the waiter after your meal.</div>
    <button class="btn plain" id="place" style="margin-top:14px">Place order</button>
    <button class="btn plain" data-close="1" style="margin-top:8px;background:transparent;color:var(--text);border:1px solid var(--line)">Back to menu</button>
    <div class="msg err" id="cerr"></div>`;
  $('sheet').classList.add('show');
}
async function place(){
  $('place').disabled = true; $('cerr').textContent = '';
  const payload = Object.entries(cart).map(([item_id, qty]) => ({ item_id, qty }));
  const { data, error } = await dfClient.rpc('place_order', { p_restaurant: R.id, p_table: T ? T.id : null, p_items: payload, p_note: $('note').value.trim() || null });
  if (error) { $('cerr').textContent = error.message; $('place').disabled = false; return; }
  orderId = data; localStorage.setItem('df_order_' + R.id, orderId); cart = {};
  $('sheet').classList.remove('show'); track();
}

const STEPS = [['pending','Received','📝'],['preparing','Preparing','👨‍🍳'],['ready','Ready','✅'],['served','Served','🍽️']];
async function track(){
  clearInterval(pollTimer);
  const draw = async () => {
    const { data } = await dfClient.rpc('get_order_status', { p_order: orderId });
    const o = data && data[0];
    if (!o) { localStorage.removeItem('df_order_' + R.id); orderId = null; clearInterval(pollTimer); return renderMenu(); }
    const idx = STEPS.findIndex(s => s[0] === o.status);
    $('app').innerHTML = `<header><h1>${esc(R.name)}</h1><div class="tb">${T ? 'Table ' + esc(T.label) : ''}</div></header>
      <div class="wrap">
      ${o.status === 'cancelled' ? '<div class="card">This order was cancelled. Please ask the staff.</div>' : `
      <div class="steps">${STEPS.map((s,i) => `<div class="st ${i<=idx?'on':''}"><i>${s[2]}</i>${s[1]}</div>`).join('')}</div>`}
      <div class="card"><b>Total: ₹${Number(o.total).toFixed(2)}</b><div style="color:var(--muted);font-size:14px;margin-top:4px">${o.payment_status === 'paid' ? '✅ Paid' : (R.upi_id ? 'Pay online, or at the counter.' : 'Payment pending, please pay at the counter.')}</div>
        ${o.payment_status !== 'paid' && R.upi_id && o.status !== 'cancelled' ? `<a class="btn plain" style="margin-top:12px;text-decoration:none" href="${esc('upi://pay?pa=' + encodeURIComponent(R.upi_id) + '&pn=' + encodeURIComponent(R.name) + '&am=' + Number(o.total).toFixed(2) + '&cu=INR&tn=' + encodeURIComponent('Order ' + (T ? 'Table ' + T.label : '')))}">Pay ₹${Number(o.total).toFixed(2)} with UPI</a><div style="font-size:12px;color:var(--muted);margin-top:8px">After paying, staff will confirm your payment.</div>` : ''}</div>
      <div class="card"><b>Need something?</b><div class="help">
        <button data-call="water">💧 Water</button><button data-call="napkin">🧻 Napkins</button><button data-call="assistance">🙋 Waiter</button></div>
        <div class="msg" id="cmsg"></div></div>
      ${o.status === 'served' || o.status === 'ready' ? `<div class="card"><b>How was it?</b><div class="stars" id="stars">${[1,2,3,4,5].map(n => `<button data-star="${n}">★</button>`).join('')}</div>
        <textarea id="fbt" rows="2" maxlength="500" placeholder="Comments (optional)"></textarea>
        <button class="btn plain" id="fbsend" style="margin-top:10px">Send feedback</button><div class="msg" id="fmsg"></div></div>` : ''}
      <button class="btn plain" data-neworder="1" style="margin-top:18px;background:transparent;color:var(--text);border:1px solid var(--line)">Order more</button>
      </div>`;
  };
  await draw(); pollTimer = setInterval(() => { if (!document.getElementById('stars')) draw(); }, 5000);
}

let rating = 0;
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.cat) { activeCat = d.cat === 'all' ? 'all' : d.cat; renderMenu(); }
  if (d.veg) { vegOnly = !vegOnly; renderMenu(); }
  if (d.inc) { cart[d.inc] = (cart[d.inc] || 0) + 1; renderMenu(); }
  if (d.dec) { cart[d.dec] = (cart[d.dec] || 1) - 1; if (cart[d.dec] <= 0) delete cart[d.dec]; renderMenu(); }
  if (d.cart) openCart();
  if (d.close) $('sheet').classList.remove('show');
  if (t.id === 'place') place();
  if (d.neworder) { clearInterval(pollTimer); localStorage.removeItem('df_order_' + R.id); orderId = null; renderMenu(); }
  if (d.call) {
    if (!T) { $('cmsg').textContent = 'Table not detected. Please ask the staff.'; $('cmsg').className = 'msg err'; return; }
    const { error } = await dfClient.rpc('call_waiter', { p_restaurant: R.id, p_table: T.id, p_reason: d.call });
    $('cmsg').textContent = error ? error.message : 'Staff have been notified ✓'; $('cmsg').className = 'msg ' + (error ? 'err' : '');
  }
  if (d.star) { rating = +d.star; document.querySelectorAll('#stars button').forEach(b => b.classList.toggle('on', +b.dataset.star <= rating)); }
  if (t.id === 'fbsend') {
    if (!rating) { $('fmsg').textContent = 'Please tap a star rating.'; $('fmsg').className = 'msg err'; return; }
    const { error } = await dfClient.rpc('submit_feedback', { p_order: orderId, p_rating: rating, p_comment: $('fbt').value.trim() || null });
    $('fmsg').textContent = error ? error.message : 'Thank you! 🧡'; $('fmsg').className = 'msg ' + (error ? 'err' : '');
    if (!error) t.disabled = true;
  }
});
init();
</script>
</body></html>
