<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join your team – DineFlow</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body>
<div class="center"><div class="box">
  <a href="index.html" class="logo">Dine<span>Flow</span></a>
  <h1>Join your restaurant team</h1>
  <p class="sub">Use the same email your owner invited</p>
  <form id="f">
    <label>Email</label><input id="email" type="email" required autocomplete="email">
    <label>Create password</label><input id="pw" type="password" required minlength="8" autocomplete="new-password">
    <button class="btn" id="btn">Create account</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="alt">Already have an account? <a href="login.html">Log in</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('btn').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Creating account…';
  const { data, error } = await dfClient.auth.signUp({ email: $('email').value.trim(), password: $('pw').value });
  if (error) { $('msg').textContent = error.message; $('msg').className = 'msg err'; $('btn').disabled = false; return; }
  if (data.session) location.href = 'dashboard.html';
  else { $('msg').textContent = 'Check your email to confirm, then log in.'; $('msg').className = 'msg ok'; $('btn').disabled = false; }
});
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
