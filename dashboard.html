<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – CaffCrew</title>
<link rel="stylesheet" href="css/auth.css">





<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121110">
<meta name="application-name" content="CaffCrew">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CaffCrew">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/brand.css">
<script src="js/coin.js"></script>
<script src="js/splash.js"></script>
<script src="js/pwa.js" defer></script>
</head><body class="df-app">
<div class="top">
  <a class="logo" href="dashboard.html"><img class="lg" src="icons/logo-96.png" alt="" width="36" height="36"><em class="lt">Caff<span>Crew</span></em></a>
  <button class="btn ghost" id="out">Log out</button>
</div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><p style="color:var(--muted)">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>

$('out').onclick = async () => { await dfClient.auth.signOut(); location.href = 'login.html'; };

async function init(){
  const { data: { session } } = await dfClient.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }

  let { data: mem, error } = await dfClient.from('restaurant_members')
    .select('role, restaurants(id, name, slug, plan_id, is_active, paid_until)').eq('user_id', session.user.id).limit(1);
  if (error) { $('app').innerHTML = '<p style="color:var(--err)">' + esc(error.message) + '</p>'; return; }

  if (!mem.length) {
    const { data: isAdmin } = await dfClient.rpc('is_platform_admin');
    if (isAdmin) { location.href = 'super-admin.html'; return; }
    await dfClient.rpc('claim_invites');
    ({ data: mem } = await dfClient.from('restaurant_members').select('role, restaurants(id, name, slug, plan_id, is_active, paid_until)').eq('user_id', session.user.id).limit(1));
  }

  // First login after registering: create the restaurant
  if (!mem.length) {
    const pending = JSON.parse(localStorage.getItem('df_pending') || 'null');
    if (!pending) { $('app').innerHTML = '<p>No restaurant found. <a href="register.html">Register one</a>.</p>'; return; }
    const { error: e2 } = await dfClient.rpc('create_restaurant', { p_name: pending.name, p_slug: pending.slug });
    if (e2) { $('app').innerHTML = '<p style="color:var(--err)">Could not create restaurant: ' + esc(e2.message) + '<br>Try a different page address.</p>'; localStorage.removeItem('df_pending'); return; }
    localStorage.removeItem('df_pending');
    return init();
  }

  if (!dfLive(mem[0].restaurants)) {
    const x = mem[0].restaurants;
    const [h, t] = !x.is_active && !x.paid_until ? ['Waiting for activation', 'Your restaurant is registered. It will go live once your plan is activated.']
      : x.paid_until && x.paid_until < dfToday() ? ['Subscription ended', 'Your plan ended on ' + x.paid_until + '. Renew to keep taking orders.']
      : ['Account suspended', 'Your account is currently suspended.'];
    $('app').innerHTML = `<div class="panel" style="text-align:center;margin-top:40px"><h2>${h}</h2><p style="color:var(--muted);margin:10px 0">${esc(t)}</p><p><b>${esc((window.DF_CONFIG || {}).SUPPORT_TEXT || '')}</b></p></div>`;
    return;
  }
  if (mem[0].role === 'waiter') { location.href = 'floor.html'; return; }
  if (mem[0].role === 'kitchen') { location.href = 'kitchen.html'; return; }
  const r = mem[0].restaurants;
  $('app').innerHTML = `
    <h2>${esc(r.name)}</h2>
    <p style="color:var(--muted)">Plan: ${esc(r.plan_id)} · Role: ${esc(mem[0].role)}</p>
    <div class="panel">Your public page: <code>caffcrew.in/${esc(r.slug)}</code></div>
    <div class="grid">
      <div class="stat"><b>0</b><span>Orders today</span></div>
      <div class="stat"><b>₹0</b><span>Revenue today</span></div>
      <div class="stat"><b>0</b><span>Pending now</span></div>
      <div class="stat"><b>₹0</b><span>Average order</span></div>
      <div class="stat"><b>0</b><span>Tables</span></div>
      <div class="stat"><b>0</b><span>Menu items</span></div>
    </div>
    <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><b>Live activity</b><span id="lv" class="tag u">connecting…</span></div><div id="feed" style="margin-top:6px"><p style="color:var(--muted);font-size:14px">Loading…</p></div></div>
    <div class="panel"><b>Quick links</b>
      <div class="row" style="margin-top:10px">
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-menu.html">Menu</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-tables.html">Tables &amp; QR</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="kitchen.html">Kitchen</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="floor.html">Floor</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-analytics.html">Analytics</a>
      </div></div>`;
  renderNav('dashboard.html', mem[0].role);
  dfClient.rpc('is_platform_admin').then(({ data }) => { if (data) $('nav').insertAdjacentHTML('beforeend', '<a href="super-admin.html">Super Admin</a>'); });
  const money = n => '₹' + Math.round(n).toLocaleString('en-IN');
  const ST = { pending: 'New', preparing: 'Preparing', ready: 'Ready', served: 'Served', cancelled: 'Cancelled' };
  const ago = ts => { const m = Math.floor((Date.now() - new Date(ts)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.floor(m / 60) + ' h ago'; };
  const st = document.querySelectorAll('.stat b');
  dfClient.from('menu_items').select('id', { count: 'exact', head: true }).eq('restaurant_id', r.id).then(x => st[5].textContent = x.count || 0);
  async function refresh(){
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const [td, pd, tb, fd] = await Promise.all([
      dfClient.from('orders').select('total').eq('restaurant_id', r.id).neq('status', 'cancelled').gte('created_at', t0.toISOString()),
      dfClient.from('orders').select('id', { count: 'exact', head: true }).eq('restaurant_id', r.id).in('status', ['pending', 'preparing']),
      dfClient.from('dining_tables').select('id,label').eq('restaurant_id', r.id),
      dfClient.from('orders').select('id,status,total,payment_status,table_id,created_at').eq('restaurant_id', r.id).order('created_at', { ascending: false }).limit(8)
    ]);
    const lab = {}; (tb.data || []).forEach(x => lab[x.id] = x.label); st[4].textContent = (tb.data || []).length;
    if (td.data) { const sum = td.data.reduce((a, x) => a + Number(x.total), 0); st[0].textContent = td.data.length; st[1].textContent = money(sum); st[3].textContent = td.data.length ? money(sum / td.data.length) : '₹0'; }
    st[2].textContent = pd.count || 0;
    $('feed').innerHTML = (fd.data || []).map(o => `<div class="item"><div class="info"><b>${lab[o.table_id] ? 'Table ' + esc(lab[o.table_id]) : 'No table'}</b> · ${money(o.total)}<small>${ago(o.created_at)}${o.payment_status === 'paid' ? ' · Paid' : ''}</small></div><span class="tag ${o.status === 'pending' ? 'u' : ''}">${ST[o.status] || o.status}</span></div>`).join('') || '<p style="color:var(--muted);font-size:14px">No orders yet. They will appear here live.</p>';
  }
  refresh();
  dfClient.channel('dash-' + r.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: 'restaurant_id=eq.' + r.id }, refresh)
    .subscribe(s => { $('lv').textContent = s === 'SUBSCRIBED' ? '● Live' : s.toLowerCase(); $('lv').className = 'tag' + (s === 'SUBSCRIBED' ? '' : ' u'); });
  setInterval(refresh, 30000);
}
init();
</script>

</body></html>
