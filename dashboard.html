<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – DineFlow</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/splash.js"></script>
</head><body>
<div class="top">
  <a class="logo" href="dashboard.html">Dine<span>Flow</span></a>
  <button class="btn ghost" id="out">Log out</button>
</div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><p style="color:var(--muted)">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>

$('out').onclick = async () => { await dfClient.auth.signOut(); location.href = 'login.html'; };

async function init(){
  const { data: { session } } = await dfClient.auth.getSession();
  if (!session) { location.href = 'login.html'; return; }

  let { data: mem, error } = await dfClient.from('restaurant_members')
    .select('role, restaurants(id, name, slug, plan_id, is_active, paid_until)').eq('user_id', session.user.id).limit(1);
  if (error) { $('app').innerHTML = '<p style="color:var(--err)">' + esc(error.message) + '</p>'; return; }

  if (!mem.length) {
    const { data: isAdmin } = await dfClient.rpc('is_platform_admin');
    if (isAdmin) { location.href = 'super-admin.html'; return; }
    await dfClient.rpc('claim_invites');
    ({ data: mem } = await dfClient.from('restaurant_members').select('role, restaurants(id, name, slug, plan_id, is_active, paid_until)').eq('user_id', session.user.id).limit(1));
  }

  // First login after registering: create the restaurant
  if (!mem.length) {
    const pending = JSON.parse(localStorage.getItem('df_pending') || 'null');
    if (!pending) { $('app').innerHTML = '<p>No restaurant found. <a href="register.html">Register one</a>.</p>'; return; }
    const { error: e2 } = await dfClient.rpc('create_restaurant', { p_name: pending.name, p_slug: pending.slug });
    if (e2) { $('app').innerHTML = '<p style="color:var(--err)">Could not create restaurant: ' + esc(e2.message) + '<br>Try a different page address.</p>'; localStorage.removeItem('df_pending'); return; }
    localStorage.removeItem('df_pending');
    return init();
  }

  if (!dfLive(mem[0].restaurants)) {
    const x = mem[0].restaurants;
    const [h, t] = !x.is_active && !x.paid_until ? ['Waiting for activation', 'Your restaurant is registered. It will go live once your plan is activated.']
      : x.paid_until && x.paid_until < dfToday() ? ['Subscription ended', 'Your plan ended on ' + x.paid_until + '. Renew to keep taking orders.']
      : ['Account suspended', 'Your account is currently suspended.'];
    $('app').innerHTML = `<div class="panel" style="text-align:center;margin-top:40px"><h2>${h}</h2><p style="color:var(--muted);margin:10px 0">${esc(t)}</p><p><b>${esc((window.DF_CONFIG || {}).SUPPORT_TEXT || '')}</b></p></div>`;
    return;
  }
  if (['kitchen','waiter'].includes(mem[0].role)) { location.href = 'kitchen.html'; return; }
  const r = mem[0].restaurants;
  $('app').innerHTML = `
    <h2>${esc(r.name)}</h2>
    <p style="color:var(--muted)">Plan: ${esc(r.plan_id)} · Role: ${esc(mem[0].role)}</p>
    <div class="panel">Your public page: <code>dineflow.in/${esc(r.slug)}</code></div>
    <div class="grid">
      <div class="stat"><b>0</b><span>Orders today</span></div>
      <div class="stat"><b>₹0</b><span>Revenue today</span></div>
      <div class="stat"><b>0</b><span>Tables</span></div>
      <div class="stat"><b>0</b><span>Menu items</span></div>
    </div>
    <div class="panel"><b>Quick links</b>
      <div class="row" style="margin-top:10px">
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-menu.html">Menu</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-tables.html">Tables &amp; QR</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="kitchen.html">Kitchen</a>
        <a class="btn sm ghost" style="text-decoration:none;text-align:center" href="admin-analytics.html">Analytics</a>
      </div></div>`;
  renderNav('dashboard.html', mem[0].role);
  dfClient.rpc('is_platform_admin').then(({ data }) => { if (data) $('nav').insertAdjacentHTML('beforeend', '<a href="super-admin.html">Super Admin</a>'); });
  const cnt = async tb => (await dfClient.from(tb).select('id', { count: 'exact', head: true }).eq('restaurant_id', r.id)).count || 0;
  const [nt, nm] = await Promise.all([cnt('dining_tables'), cnt('menu_items')]);
  const st = document.querySelectorAll('.stat b'); st[2].textContent = nt; st[3].textContent = nm;
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const { data: td } = await dfClient.from('orders').select('total').eq('restaurant_id', r.id).neq('status', 'cancelled').gte('created_at', t0.toISOString());
  if (td) { st[0].textContent = td.length; st[1].textContent = '₹' + Math.round(td.reduce((a, x) => a + Number(x.total), 0)).toLocaleString('en-IN'); }
}
init();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
