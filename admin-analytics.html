<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics – DineFlow</title>
<link rel="stylesheet" href="css/auth.css">
<style>
.rng{display:flex;gap:8px;margin:12px 0}
.rng button{flex:0}
.rng .on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:12px}
.bar{flex:1;min-width:4px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;opacity:.9}
.bar:hover{opacity:1}
.lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.top{}
.tr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr:last-child{border:0}
.tr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .meter{flex:1;height:8px;background:#0f0f10;border-radius:99px;overflow:hidden}
.tr .meter i{display:block;height:100%;background:var(--accent)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="js/splash.js"></script>
</head><body>
<div class="top"><a class="logo" href="dashboard.html">Dine<span>Flow</span></a><button class="btn ghost" id="out">Log out</button></div>
<div class="nav" id="nav"></div>
<div class="wrap">
  <h2>Analytics</h2>
  <div class="rng">
    <button class="btn sm ghost" data-d="1">Today</button>
    <button class="btn sm ghost on" data-d="7">7 days</button>
    <button class="btn sm ghost" data-d="30">30 days</button>
  </div>
  <div class="grid">
    <div class="stat"><b id="rev">–</b><span>Sales</span></div>
    <div class="stat"><b id="cnt">–</b><span>Orders</span></div>
    <div class="stat"><b id="avg">–</b><span>Average order</span></div>
    <div class="stat"><b id="peak">–</b><span>Busiest hour</span></div>
  </div>
  <div class="panel"><b>Sales by day</b><div class="bars" id="bars"></div><div class="lbls" id="lbls"></div></div>
  <div class="panel"><b>Most ordered dishes</b><div id="top" style="margin-top:6px"></div></div>
  <p style="color:var(--muted);font-size:12px;margin-top:14px">Sales = all orders except cancelled.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>
let R, days = 7;
const rupee = n => '₹' + Math.round(n).toLocaleString('en-IN');
const dkey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

async function load(){
  const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate() - (days - 1));
  const { data, error } = await dfClient.from('orders').select('total,status,created_at,order_items(name,qty)')
    .eq('restaurant_id', R.id).neq('status', 'cancelled').gte('created_at', from.toISOString()).order('created_at').limit(1000);
  if (error) { $('rev').textContent = '!'; alert(error.message); return; }
  const o = data || [];
  const rev = o.reduce((s, x) => s + Number(x.total), 0);
  $('rev').textContent = rupee(rev); $('cnt').textContent = o.length; $('avg').textContent = o.length ? rupee(rev / o.length) : '₹0';

  const hours = Array(24).fill(0); o.forEach(x => hours[new Date(x.created_at).getHours()]++);
  const mx = Math.max(...hours);
  $('peak').textContent = mx ? (h => (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'))(hours.indexOf(mx)) : '–';

  const byDay = {}; for (let i = 0; i < days; i++) { const d = new Date(from); d.setDate(d.getDate() + i); byDay[dkey(d)] = 0; }
  o.forEach(x => { const k = dkey(new Date(x.created_at)); if (k in byDay) byDay[k] += Number(x.total); });
  const keys = Object.keys(byDay), vals = Object.values(byDay), m = Math.max(...vals, 1);
  $('bars').innerHTML = keys.map((k, i) => `<div class="bar" style="height:${Math.max(vals[i] / m * 100, vals[i] ? 3 : 1)}%" title="${k}: ${rupee(vals[i])}"></div>`).join('');
  $('lbls').innerHTML = `<span>${keys[0].slice(5)}</span><span>${keys[keys.length-1].slice(5)}</span>`;

  const cnt = {}; o.forEach(x => (x.order_items || []).forEach(i => cnt[i.name] = (cnt[i.name] || 0) + i.qty));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 8), tm = top.length ? top[0][1] : 1;
  $('top').innerHTML = top.map(([n, q]) => `<div class="tr"><span class="n">${esc(n)}</span><span class="meter"><i style="width:${q / tm * 100}%"></i></span><b>${q}</b></div>`).join('') || '<p style="color:var(--muted);font-size:14px">No orders in this period yet.</p>';
}
document.querySelector('.rng').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  days = +b.dataset.d; document.querySelectorAll('.rng button').forEach(x => x.classList.toggle('on', x === b)); load();
});
adminInit('admin-analytics.html').then(x => { if (x) { R = x.r; load(); } });
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
