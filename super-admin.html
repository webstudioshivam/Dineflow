<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin – DineFlow</title>
<link rel="stylesheet" href="css/auth.css">
<style>.r{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.r.off{opacity:.65}.r h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:13px;margin:4px 0 10px}.tag{font-size:12px;border-radius:99px;padding:1px 9px;background:#12301f;color:var(--ok)}
.tag.u{background:#33201a;color:#ff9a4d}</style>
</head><body>
<div class="top"><a class="logo" href="super-admin.html">Dine<span>Flow</span> <small style="font-size:12px;color:var(--muted)">Super Admin</small></a><button class="btn ghost" id="out">Log out</button></div>
<div class="wrap">
  <div class="grid">
    <div class="stat"><b id="s1">–</b><span>Restaurants</span></div>
    <div class="stat"><b id="s2">–</b><span>Active</span></div>
    <div class="stat"><b id="s3">–</b><span>Monthly subscription value</span></div>
    <div class="stat"><b id="s4">–</b><span>Total orders</span></div>
  </div>
  <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + Math.round(n).toLocaleString('en-IN');
let rows = [], plans = [];
$('out').onclick = async () => { await dfClient.auth.signOut(); location.href = 'login.html'; };

async function load(){
  const [o, p] = await Promise.all([dfClient.rpc('admin_overview'), dfClient.from('plans').select('*').order('price_inr')]);
  if (o.error) { $('list').innerHTML = `<p class="msg err">${esc(o.error.message)}</p>`; return; }
  rows = o.data || []; plans = p.data || [];
  const price = id => (plans.find(x => x.id === id) || {}).price_inr || 0;
  const act = rows.filter(r => r.is_active);
  $('s1').textContent = rows.length; $('s2').textContent = act.length;
  $('s3').textContent = rs(act.reduce((s, r) => s + price(r.plan_id), 0));
  $('s4').textContent = rows.reduce((s, r) => s + Number(r.orders_count), 0);
  $('list').innerHTML = rows.map(r => `<div class="r ${r.is_active ? '' : 'off'}">
    <h3><span>${esc(r.name)}</span><span class="tag ${r.is_active ? '' : 'u'}">${r.is_active ? 'Active' : 'Suspended'}</span></h3>
    <div class="meta">/${esc(r.slug)} · ${r.orders_count} orders · ${rs(r.revenue)} sales · ${r.staff_count} staff · joined ${new Date(r.created_at).toLocaleDateString('en-IN')}${r.last_order ? ' · last order ' + new Date(r.last_order).toLocaleDateString('en-IN') : ''}</div>
    <div class="row">
      <div><label>Plan</label><select data-plan="${r.id}">${plans.map(x => `<option value="${x.id}" ${x.id === r.plan_id ? 'selected' : ''}>${esc(x.name)} – ₹${x.price_inr}</option>`).join('')}</select></div>
      <div><label>Custom domain (Premium)</label><input data-dom="${r.id}" value="${esc(r.custom_domain || '')}" placeholder="menu.example.com" ${(plans.find(x => x.id === r.plan_id) || {}).custom_domain ? '' : 'disabled'}></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" data-save="${r.id}">Save</button>
    <button class="btn sm ${r.is_active ? 'danger' : ''}" data-toggle="${r.id}">${r.is_active ? 'Suspend' : 'Activate'}</button></div>
  </div>`).join('') || '<p style="color:var(--muted);margin-top:16px">No restaurants yet.</p>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.toggle) {
    const r = rows.find(x => x.id === b.dataset.toggle);
    if (!confirm((r.is_active ? 'Suspend ' : 'Activate ') + r.name + '?')) return;
    const { error } = await dfClient.from('restaurants').update({ is_active: !r.is_active }).eq('id', r.id);
    if (error) alert(error.message); load();
  }
  if (b.dataset.save) {
    const id = b.dataset.save, dom = document.querySelector(`[data-dom="${id}"]`);
    const { error } = await dfClient.from('restaurants').update({ plan_id: document.querySelector(`[data-plan="${id}"]`).value, custom_domain: dom.disabled ? null : (dom.value.trim().toLowerCase() || null) }).eq('id', id);
    if (error) alert(error.message); else b.textContent = 'Saved ✓'; setTimeout(load, 700);
  }
});
document.addEventListener('change', e => { // enable/disable domain field when plan changes
  const id = e.target.dataset.plan; if (!id) return;
  const dom = document.querySelector(`[data-dom="${id}"]`); dom.disabled = !(plans.find(x => x.id === e.target.value) || {}).custom_domain;
});
(async () => {
  const { data: { session } } = await dfClient.auth.getSession();
  if (!session) return location.href = 'login.html';
  const { data: ok } = await dfClient.rpc('is_platform_admin');
  if (!ok) return location.href = 'dashboard.html';
  load();
})();
</script>
</body></html>
